<!doctype html>
<html lang="en">
  {{HEAD}}
  <body>
    {{CHROME}}
    <main>
      <section class="localhoster-toolbar">
        <div class="status-strip" id="status-strip"></div>
        <div class="toolbar-actions">
          <label class="search-field" for="search">
            <span>Search</span>
            <input id="search" type="search" placeholder="project, app, port, route" />
          </label>
          <button id="refresh" type="button">Refresh</button>
          <span class="refresh-state" id="refresh-state" aria-live="polite"></span>
        </div>
      </section>
      <section id="capability" class="notice" hidden></section>
      <section id="warnings" class="notice warn" hidden></section>
      <section id="content" class="localhoster-content"></section>
    </main>

    <dialog id="link-dialog" aria-labelledby="link-dialog-title">
      <form method="dialog" id="link-form">
        <div class="modal-head">
          <h2 id="link-dialog-title">Edit links</h2>
          <button type="button" class="modal-close" data-close aria-label="Close">x</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="link-project" />
          <input type="hidden" id="link-app" />
          <div class="link-list" id="link-list"></div>
          <div class="item-err" id="link-error"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="link-add">Add row</button>
          <button type="submit">Save links</button>
        </div>
      </form>
    </dialog>

    <dialog id="app-dialog" aria-labelledby="app-dialog-title">
      <form method="dialog" id="app-form">
        <div class="modal-head">
          <h2 id="app-dialog-title">App association</h2>
          <button type="button" class="modal-close" data-close aria-label="Close">x</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="app-association" />
          <label>
            Project identity
            <input id="app-project" required />
          </label>
          <label>
            Project name
            <input id="app-project-name" maxlength="80" placeholder="Project name" />
          </label>
          <label>
            App id
            <input id="app-id" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,79}" placeholder="web" />
          </label>
          <label>
            App name
            <input id="app-name" required maxlength="80" placeholder="Web" />
          </label>
          <label>
            Preferred host
            <select id="app-origin">
              <option value="localhost">localhost</option>
              <option value="127.0.0.1">127.0.0.1</option>
              <option value="::1">::1</option>
            </select>
          </label>
          <div class="item-err" id="app-error"></div>
        </div>
        <div class="modal-actions">
          <button type="submit">Save project/app</button>
        </div>
      </form>
    </dialog>

    <template id="tpl-status-pill">
      <div class="status-pill">
        <strong data-slot="value"></strong>
        <span data-slot="label"></span>
      </div>
    </template>
    <template id="tpl-group">
      <section class="instance-group">
        <header>
          <h2 data-slot="title"></h2>
          <span data-slot="meta"></span>
        </header>
        <div class="instance-grid" data-slot="items"></div>
      </section>
    </template>
    <template id="tpl-collapsible-group">
      <details class="instance-group collapsed-group">
        <summary>
          <span data-slot="title"></span>
          <span data-slot="meta"></span>
        </summary>
        <div class="instance-grid" data-slot="items"></div>
      </details>
    </template>
    <template id="tpl-card">
      <article class="instance-card">
        <div class="card-head">
          <div class="card-title">
            <h3 data-slot="title"></h3>
            <span class="title-separator">-</span>
            <a data-slot="origin" target="_blank" rel="noreferrer"></a>
            <span class="info-wrap">
              <portal-info-icon aria-label="Show instance details"></portal-info-icon>
              <span class="info-tooltip" role="tooltip">
                <span><strong>Health</strong><span data-slot="status"></span></span>
                <span><strong>Latency</strong><span data-slot="latency"></span></span>
                <span><strong>Process</strong><span data-slot="process"></span></span>
                <span><strong>Identity</strong><span data-slot="identity"></span></span>
                <span><strong>Bind</strong><span data-slot="bind"></span></span>
                <span data-slot="warning" hidden></span>
              </span>
            </span>
          </div>
          <div class="action-menu">
            <button type="button" class="menu-trigger" data-action="menu" aria-label="Actions" aria-expanded="false">
              <span></span><span></span><span></span>
            </button>
            <div class="menu-panel" data-menu hidden>
              <button type="button" data-action="link">Add link</button>
              <button type="button" data-action="edit">Edit links</button>
              <button type="button" data-action="copy">Copy URL</button>
              <button type="button" data-action="open">Open</button>
              <button type="button" data-action="associate">Change association</button>
            </div>
          </div>
        </div>
        <p class="card-subtitle" data-slot="subtitle"></p>
        <div class="quick-links" data-slot="links" hidden></div>
      </article>
    </template>
    <template id="tpl-empty">
      <section class="empty-state">
        <h2 data-slot="title"></h2>
        <p data-slot="body"></p>
      </section>
    </template>
    <template id="tpl-link-row">
      <div class="link-row">
        <input type="hidden" data-field="id" />
        <label>
          Label
          <input data-field="label" required maxlength="80" />
        </label>
        <label>
          Path or loopback URL
          <input data-field="path" required placeholder="/admin" />
        </label>
        <div class="link-row-actions">
          <button type="button" data-action="up" aria-label="Move link up">Up</button>
          <button type="button" data-action="down" aria-label="Move link down">Down</button>
          <button type="button" data-action="remove" aria-label="Remove link">Remove</button>
        </div>
      </div>
    </template>
    <script type="module" src="/portal/shared/info-icon.js"></script>
    <script type="module" src="/portal/shared/theme.js"></script>
    <script type="module" src="/portal/localhoster/app.js"></script>
  </body>
</html>
