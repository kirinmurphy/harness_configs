<!doctype html>
<html lang="en">
  {{HEAD}}
  <body>
    {{CHROME}}
    {{WIDGET_TEMPLATES}}
    <main id="main" class="inner">
      {{LOADING}}
      <!-- Static shell shown until the first snapshot loads (see .page-loading in base.css). Mirrors
       tpl-config-files's row spine so the loading scrim sits over real structure instead of a blank
       page; the per-harness data columns aren't shown here since the real column count is only
       known once the snapshot with its `harnesses` list arrives. app.js's render() replaceChildren()s
       this away on first successful load(); the dynamic behaviorView sections that follow it are
       genuinely server-computed and have no static equivalent, so they simply aren't in this
       pre-hydration shell. -->
      <section class="panel wide">
        <div class="config-grid" role="table" aria-label="Agent files">
          <div class="config-grid-row" role="row">
            <div class="config-type" role="cell">
              <strong>Usage</strong>
              <span>Startup context loaded automatically.</span>
            </div>
          </div>
          <div class="config-grid-row" role="row">
            <div class="config-type" role="cell">
              <strong>Rules</strong>
              <span>Global context for every session.</span>
            </div>
          </div>
          <div class="config-grid-row" role="row">
            <div class="config-type" role="cell">
              <strong>Config</strong>
              <span>Settings, permissions, and runtime defaults.</span>
            </div>
          </div>
          <div class="config-grid-row" role="row">
            <div class="config-type" role="cell">
              <strong>Hooks</strong>
              <span>Automation triggered by lifecycle or tool events.</span>
            </div>
          </div>
        </div>
      </section>
    </main>
    <dialog id="config-modal" aria-labelledby="modal-title">
      <div class="modal-head">
        <div class="modal-head-main">
          <span class="modal-title" id="modal-title"></span>
          <portal-close-button id="modal-close"></portal-close-button>
        </div>
        <span class="modal-path" id="modal-path"></span>
      </div>
      <div class="modal-cost-row" id="modal-cost-row" hidden></div>
      <div class="modal-body">
        <div class="markdown" id="modal-content"></div>
      </div>
      <div class="modal-footer" id="modal-footer" hidden></div>
    </dialog>
    <!-- Agent files summary: token warnings + per-harness file grid + defaults popover -->
    <template id="tpl-context-warnings">
      <portal-notice class="token-warnings" variant="warning" aria-live="polite">
        <div class="token-warnings-body">
          <p class="token-warnings-title" data-slot="title"></p>
          <div class="token-warning-list" data-slot="items"></div>
        </div>
      </portal-notice>
    </template>
    <!-- Config grid shell: header + 4 row skeletons, one per config-type. The row-label cell
     (strong + description) doesn't vary per harness so it's authored here; each row's per-harness
     data cells start empty and are filled by cloning the matching tpl-config-*-cell template once
     per registered provider (templates.js's configFiles/configGridColumn) — never JS-built markup. -->
    <template id="tpl-config-files">
      <section class="panel wide">
        <div class="config-grid" role="table" aria-label="Agent files">
          <div class="config-grid-head" role="row" data-slot="head">
            <div role="columnheader"></div>
          </div>
          <div class="config-grid-row" role="row" data-slot="row-usage">
            <div class="config-type" role="cell">
              <strong>Usage</strong>
              <span>Startup context loaded automatically.</span>
            </div>
          </div>
          <div class="config-grid-row" role="row" data-slot="row-rules">
            <div class="config-type" role="cell">
              <strong>Rules</strong>
              <span>Global context for every session.</span>
            </div>
          </div>
          <div class="config-grid-row" role="row" data-slot="row-config">
            <div class="config-type" role="cell">
              <strong>Config</strong>
              <span>Settings, permissions, and runtime defaults.</span>
            </div>
          </div>
          <div class="config-grid-row" role="row" data-slot="row-hooks">
            <div class="config-type" role="cell">
              <strong>Hooks</strong>
              <span>Automation triggered by lifecycle or tool events.</span>
            </div>
          </div>
        </div>
      </section>
    </template>
    <!-- Zero-harness state for the Agents grid. A machine with no detected harness gets this
         instead of a grid of columns for every provider roborepo happens to support. -->
    <template id="tpl-config-files-empty">
      <section class="panel wide">
        <div class="config-empty">
          <strong>No agent harnesses detected on this machine.</strong>
          <span>
            RoboRepo supports <span data-slot="supported"></span>. Install or launch one, then run
            <code>roborepo harness refresh</code> to pick it up.
          </span>
        </div>
      </section>
    </template>
    <!-- Managed cleanup. Preserve-only by construction: there is no workspace-deletion control
         here, because irreversibly removing a user's authored content should be a deliberate typed
         CLI opt-in (roborepo uninstall --delete-workspace), not a button. -->
    <template id="tpl-maintenance">
      <section class="panel wide">
        <h2>Maintenance</h2>
        <div class="maintenance-row">
          <div class="maintenance-copy">
            <strong>Uninstall RoboRepo</strong>
            <span>
              Removes RoboRepo-managed harness configuration and machine-local state. Your workspace
              is preserved. This does not remove the npm package.
            </span>
          </div>
          <button type="button" class="danger" data-slot="preview">Preview cleanup</button>
        </div>
        <div class="maintenance-detail" data-slot="detail" hidden></div>
      </section>
    </template>
    <template id="tpl-maintenance-preview">
      <div class="maintenance-preview">
        <div data-slot="preserved" class="maintenance-preserve"></div>
        <div class="maintenance-removals">
          <strong>Will be removed</strong>
          <ul data-slot="removals"></ul>
        </div>
        <div class="maintenance-actions">
          <button type="button" class="danger" data-slot="confirm">Remove managed configuration</button>
          <button type="button" data-slot="cancel">Cancel</button>
        </div>
        <div class="maintenance-error" data-slot="error"></div>
      </div>
    </template>
    <template id="tpl-maintenance-result">
      <div class="maintenance-result">
        <strong>RoboRepo-managed configuration has been removed.</strong>
        <div data-slot="preserved"></div>
        <div>Remove the application with:</div>
        <code data-slot="npm"></code>
      </div>
    </template>
    <template id="tpl-config-header-cell">
      <div role="columnheader" data-slot="label"></div>
    </template>
    <template id="tpl-config-usage-cell">
      <div class="harness-provider" role="cell">
        <token-chip data-slot="chip"></token-chip>
      </div>
    </template>
    <template id="tpl-config-rules-cell">
      <div class="harness-provider" role="cell">
        <button class="text-link" type="button" data-slot="button"></button>
        <token-chip data-slot="chip"></token-chip>
      </div>
    </template>
    <template id="tpl-config-config-cell">
      <div class="harness-provider" role="cell">
        <button class="text-link" type="button" data-slot="button"></button>
        <span class="drift-chip" data-slot="drift" hidden></span>
      </div>
    </template>
    <template id="tpl-config-hooks-cell">
      <div class="harness-provider" role="cell">
        <button class="text-link" type="button" data-slot="button"></button>
      </div>
    </template>
    <template id="tpl-modal-defaults">
      <div class="globals-defaults">
        <details class="defaults-menu">
          <summary>Roborepo defaults</summary>
          <div class="defaults-popover">
            <button
              class="globals-default"
              type="button"
              data-rule-key="shared"
              data-rule-path="globals/rules/shared"
            >
              Global baseline
            </button>
            <div data-slot="per-harness"></div>
            <button
              class="globals-default"
              type="button"
              data-rule-key="packages"
              data-rule-path="globals/packages/*/rules.md"
            >
              Tool Add-Ons
            </button>
          </div>
        </details>
      </div>
    </template>
    <template id="tpl-modal-defaults-harness-button">
      <button class="globals-default" type="button" data-slot="button"></button>
    </template>
    <!-- Skill category sections + shared item/badge primitives -->
    <template id="tpl-section-token-optimization">
      <section class="panel">
        <div class="panel-head"><h2>Token Optimization</h2></div>
        <div data-slot="items"></div>
      </section>
    </template>
    <template id="tpl-section-commands">
      <section class="panel">
        <div class="panel-head"><h2>Skills - Workflows</h2></div>
        <p class="panel-desc">
          Named slash-command workflows you start intentionally.
        </p>
        <div data-slot="items"></div>
      </section>
    </template>
    <template id="tpl-section-code-conventions">
      <section class="panel">
        <div class="panel-head"><h2>Skills - Code Conventions</h2></div>
        <p class="panel-desc">
          Skills auto-loaded when relevant — shape output without an explicit
          command.
        </p>
        <div data-slot="items"></div>
        <p class="panel-footnote">
          * roborepo-support — help skill for this repo, always loaded.
        </p>
      </section>
    </template>
    <template id="tpl-section-chat-time-output">
      <section class="panel">
        <div class="panel-head"><h2>Chat-Time Output</h2></div>
        <p class="panel-desc">
          Inline chat notes the agent adds while responding — no files written,
          no workflow started.
        </p>
        <div data-slot="items"></div>
      </section>
    </template>
    <template id="tpl-permissions-section">
      <section class="panel">
        <div class="panel-head"><h2>Permissions</h2></div>
        <div data-slot="rows"></div>
      </section>
    </template>
    <template id="tpl-config-item">
      <div class="item">
        <span class="dot" data-slot="dot"></span>
        <div class="item-body">
          <div class="item-row">
            <span class="item-label" data-slot="label"></span>
            <a
              class="item-link-icon"
              data-slot="link-icon"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              <portal-icon name="external-link" size="xl"></portal-icon>
            </a>
            <span data-slot="badges"></span>
          </div>
          <div class="item-desc" data-slot="description"></div>
          <div class="item-hint" data-slot="hint"></div>
          <div class="item-status" data-slot="status"></div>
        </div>
        <span data-slot="toggle"></span>
      </div>
    </template>
    <template id="tpl-badge">
      <span class="badge" data-slot="text"></span>
    </template>
    <template id="tpl-labeled-token-chip">
      <span class="cost-row-item">
        <span class="cost-row-label" data-slot="label"></span>
        <token-chip data-slot="chip"></token-chip>
      </span>
    </template>
    <template id="tpl-warning-info-icon">
      <span class="token-warning-info" tabindex="0" role="button" aria-label="Skill discovery description details" aria-expanded="false">ⓘ<span class="token-warning-tip" data-slot="tip" hidden></span></span>
    </template>
    <template id="tpl-token-warning-item">
      <div class="token-warning-item">
        <span class="token-warning-label"><strong data-slot="name"></strong><span data-slot="suffix"></span>:<span data-slot="info"></span></span>
        <token-chip data-slot="chip"></token-chip>
      </div>
    </template>
    <!-- Behavior/permission controls: bucket picker, toggle, arbitrary-command rows -->
    <template id="tpl-bucket-btn">
      <button type="button" class="bucket-btn"></button>
    </template>
    <template id="tpl-config-toggle">
      <label class="switch">
        <input type="checkbox" data-slot="input" />
        <span class="switch-track">
          <span class="switch-knob"></span>
        </span>
      </label>
    </template>
    <template id="tpl-behavior-row">
      <div class="behavior-row">
        <div class="behavior-head">
          <span class="behavior-label" data-slot="label"></span>
          <span class="codex-note" data-slot="codex-only" hidden
            >Codex only</span
          >
          <span data-slot="bucket-control"></span>
          <span class="override-badge" data-slot="override-badge" hidden
            >⚡ custom</span
          >
          <button type="button" class="reset-link" data-slot="reset" hidden>
            reset
          </button>
        </div>
        <div class="behavior-desc" data-slot="description" hidden></div>
        <div class="behavior-default" data-slot="default-bucket" hidden></div>
        <div class="codex-note" data-slot="no-codex-ask" hidden>
          Codex has no per-command ask — runs without a prompt there unless
          another setting forces approval.
        </div>
        <div class="item-err" data-slot="err"></div>
      </div>
    </template>
    <template id="tpl-arbitrary-list-row">
      <div class="arbitrary-list">
        <div class="arbitrary-head" data-slot="label"></div>
        <div class="arbitrary-desc" data-slot="description" hidden></div>
        <div class="arbitrary-items" data-slot="items"></div>
        <div class="arbitrary-add">
          <input
            type="text"
            class="arbitrary-input"
            placeholder="add a command, e.g. docker run"
            data-slot="input"
          />
          <button type="button" class="arbitrary-add-btn" data-slot="add-btn">
            add as ask
          </button>
          <span class="item-err" data-slot="add-err"></span>
        </div>
      </div>
    </template>
    <template id="tpl-arbitrary-item">
      <div class="arbitrary-item">
        <span class="arbitrary-label" data-slot="label"></span>
        <span data-slot="bucket-control"></span>
        <button
          type="button"
          class="reset-link"
          data-slot="reset"
          hidden
        ></button>
        <span class="codex-note" data-slot="no-codex-ask" hidden
          >no per-command ask on Codex</span
        >
        <span class="item-err" data-slot="err"></span>
      </div>
    </template>
    <!-- Raw permission list row -->
    <template id="tpl-permission-row">
      <div class="perm-row">
        <div data-slot="content"></div>
      </div>
    </template>
    <script src="/portal/config/elements/index.js" type="module"></script>
    <script src="/portal/shared/icon.js" type="module"></script>
    <script src="/portal/shared/notice.js" type="module"></script>
    <script src="/portal/shared/close-button.js" type="module"></script>
    <script src="/portal/shared/theme.js" type="module"></script>
    <script src="/portal/config/app.js" type="module"></script>
  </body>
</html>
