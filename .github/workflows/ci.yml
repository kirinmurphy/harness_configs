name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same ref (branch or PR), so only the
# latest commit's checks finish. group is per-workflow + ref; PRs use the PR ref, main uses its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Development happens on macOS, so Linux is the leg that actually catches portability
    # regressions (GNU vs BSD coreutils flags, case-sensitive filesystems, path assumptions).
    # Both run the identical suite -- the platform-dependent code paths take their platform as an
    # injected argument rather than reading process.platform, so the same assertions are
    # meaningful on both runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The repo itself is zero-dependency (pure node + bash + curl). `expect` is a test-only
      # dependency: the install-collision suite drives the interactive installer through a pty and
      # hard-fails without it, unlike test-roborepo.sh, whose pty checks skip when it is absent.
      # macOS runners ship expect; Ubuntu runners do not. Installing it means those interactive
      # tests actually run on both, rather than the suite going quietly green with its pty coverage
      # skipped — which is the failure mode adding it to CI was meant to close.
      - name: install test dependencies (expect)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect

      # Install the devDependency graph (@playwright/test is a test-only dependency — the shipped
      # npm package stays zero-dependency via the files whitelist + no `dependencies` field).
      # `npm ci` needs the lockfile, so cache node_modules keyed on it.
      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: install dev dependencies
        run: npm ci

      # Playwright browsers live in the machine-local ms-playwright cache (~/.cache on Linux,
      # ~/Library/Caches on macOS) — a ~200MB download per runner unless cached. Cache it keyed on
      # the lockfile so the @playwright/test version bump that would change the browser build
      # invalidates the entry. The cache is restored before the install step below so CI only pays
      # the download on a cache miss.
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The portal UI suite needs Chromium actually installed. Plain install on macOS; --with-deps
      # on Linux also pulls the system libraries Chromium needs (the check job already installs
      # expect on Linux, and this is the same apt path).
      - name: install playwright chromium
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: local CI parity gate
        run: npm run check

  # The Windows installer is PowerShell and is never exercised by the bash suite above. This job
  # does not install anything -- it parses install-windows.ps1 through PowerShell's own parser and
  # asserts the script's harness list is derived from the provider manifests rather than hardcoded,
  # which is the drift that silently left Gemini invisible on Windows.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: PowerShell syntax + harness parity
        shell: pwsh
        run: pwsh -File scripts/test/windows-installer-check.ps1
